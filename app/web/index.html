<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="color-scheme" content="dark">
  <title>ScreenBridge 屏幕控制</title>
  <link rel="icon" href="/favicon.ico" sizes="16x16 24x24 32x32 48x48 64x64 128x128 256x256" type="image/x-icon">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <style>
    :root {
      --control-active: rgba(20, 116, 132, .85);
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111318;
      color: #f4f5f7;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      display: flex;
      flex-direction: column;
      margin: 0 auto;
      padding: 8px 12px;
      padding-top: max(8px, env(safe-area-inset-top));
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      max-width: 560px;
      height: 100vh;
      height: 100dvh;
    }
    html.ios-standalone body { height: 100vh; }
    :root:fullscreen { background: #111318; }
    :root:fullscreen body { max-width: none; padding: 0; }
    button {
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid #414653;
      border-radius: 9px;
      background: #242832;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    #video-bitrate, #video-scale {
      flex: 0 0 48px;
      width: 48px;
      min-height: 48px;
      padding: 0;
      border: 0;
      border-top: 1px solid #414653;
      border-radius: 0;
      background: transparent;
      color: #f4f5f7;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
    }
    #video-bitrate:focus-visible, #video-scale:focus-visible { outline: 2px solid #fff; outline-offset: -3px; }
    #bitrate-options, #scale-options {
      display: flex;
      position: absolute;
      bottom: 48px;
      right: calc(100% + 8px);
      width: 192px;
      border: 1px solid #414653;
      border-radius: 9px;
      background: #242832;
      color: #f4f5f7;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .4);
    }
    #bitrate-options { width: min(256px, calc(100vw - 80px)); }
    #scale-options { bottom: 0; }
    #bitrate-options[hidden], #scale-options[hidden] { display: none; }
    .video-option { display: block; flex: 1; min-width: 0; min-height: 40px; padding: 0; border: 0; border-radius: 0; background: transparent; color: #f4f5f7; font-size: 12px; font-weight: 600; text-align: center; }
    .video-option + .video-option { border-left: 1px solid #414653; }
    .video-option[aria-pressed="true"], .video-option:active { background: var(--control-active); }
    #status {
      position: absolute;
      z-index: 2;
      top: 8px;
      left: 50%;
      max-width: calc(100% - 16px);
      padding: 6px 10px;
      overflow: hidden;
      transform: translateX(-50%);
      border-radius: 8px;
      background: rgba(17, 19, 24, .9);
      color: #b9c1ce;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s;
    }
    #status.visible { opacity: 1; }
    #status.error { color: #ff8c8c; }
    #screen-viewport { --floating-controls-top: calc(60% - 24px); position: relative; display: flex; flex: 1; min-height: 0; width: 100%; align-items: center; justify-content: center; overflow: hidden; }
    .screen {
      position: relative;
      flex: none;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 1px solid #414653;
      border-radius: 12px;
      background: #000;
      line-height: 0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #screen-video { display: block; width: 100%; height: 100%; object-fit: fill; pointer-events: none; }
    #gesture-layer { position: absolute; inset: 0; cursor: crosshair; touch-action: none; }
    #gesture-layer.busy { cursor: wait; }
    #gesture-overlay { width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    #gesture-line { stroke: #41d1a6; stroke-width: 12; stroke-linecap: round; opacity: .9; }
    .touch-point { fill: #ffbf47; stroke: #fff; stroke-width: 5; }
    .touch-end { fill: #ff6e6e; stroke: #fff; stroke-width: 5; }
    .virtual-keys {
      position: absolute;
      z-index: 4;
      right: 12px;
      bottom: calc(100% - var(--floating-controls-top) + 8px);
      display: flex;
      flex-direction: column;
      width: 48px;
      overflow: visible;
      border: 1px solid rgba(65, 70, 83, .7);
      border-radius: 12px;
      background: rgba(36, 40, 50, .58);
      box-shadow: 0 4px 16px rgba(0, 0, 0, .24);
    }
    .virtual-keys[hidden] { display: none; }
    .virtual-keys.opens-below { top: calc(var(--floating-controls-top) + 56px); bottom: auto; }
    .virtual-keys:not(.opens-below) { flex-direction: column-reverse; }
    .virtual-keys:not(.opens-below) > button { border-top: 0; border-bottom: 1px solid #414653; }
    .virtual-keys:not(.opens-below) > [data-key="BACK"] { border-bottom: 0; border-radius: 0 0 11px 11px; }
    .virtual-keys:not(.opens-below) > #video-scale { border-radius: 11px 11px 0 0; }
    .virtual-keys:not(.opens-below) #bitrate-options { top: 48px; bottom: auto; }
    .virtual-keys:not(.opens-below) #scale-options { top: 0; bottom: auto; }
    .virtual-key {
      display: grid;
      flex: 1;
      min-height: 48px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }
    .virtual-key + .virtual-key { border-top: 1px solid #414653; }
    .virtual-key[data-key="BACK"] { border-radius: 11px 11px 0 0; }
    #video-bitrate { flex-basis: auto; }
    #video-scale { flex-basis: auto; border-radius: 0 0 11px 11px; }
    .virtual-key:active, #video-bitrate:active, #video-scale:active,
    #video-bitrate[aria-expanded="true"], #video-scale[aria-expanded="true"] { background: var(--control-active); }
    #fullscreen-toggle[hidden] { display: none; }
    #fullscreen-toggle[aria-pressed="true"] { background: var(--control-active); }
    .virtual-key svg { width: 22px; height: 22px; fill: none; stroke: #e1e5ec; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    #keys-toggle {
      position: absolute;
      z-index: 5;
      right: 12px;
      top: var(--floating-controls-top);
      display: grid;
      width: 48px;
      height: 48px;
      min-height: 48px;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(194, 202, 218, .6);
      border-radius: 50%;
      background: rgba(36, 40, 50, .58);
      color: #fff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .24);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #keys-toggle:active, #keys-toggle[aria-expanded="true"] { background: var(--control-active); }
    #keys-toggle svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  </style>
</head>
  <body>
  <main id="screen-viewport">
    <div id="status" role="status" aria-live="polite"></div>
    <div class="screen" id="screen">
      <video id="screen-video" autoplay playsinline muted></video>
      <div id="gesture-layer" aria-label="屏幕触控区域">
        <svg id="gesture-overlay" preserveAspectRatio="none" aria-hidden="true">
          <line id="gesture-line" x1="0" y1="0" x2="0" y2="0" visibility="hidden"></line>
          <circle id="gesture-start" class="touch-point" cx="0" cy="0" r="24" visibility="hidden"></circle>
          <circle id="gesture-end" class="touch-end" cx="0" cy="0" r="24" visibility="hidden"></circle>
        </svg>
      </div>
  </div>
  <nav id="virtual-keys" class="virtual-keys" aria-label="视频流和虚拟导航键" hidden>
    <div id="scale-options" role="group" aria-label="选择画面大小" hidden>
      <button class="video-option" type="button" data-scale="2" aria-pressed="true">1/2</button>
      <button class="video-option" type="button" data-scale="3" aria-pressed="false">1/3</button>
      <button class="video-option" type="button" data-scale="4" aria-pressed="false">1/4</button>
    </div>
    <div id="bitrate-options" role="group" aria-label="选择视频码率" hidden>
      <button class="video-option" type="button" data-bitrate="250000" aria-pressed="false">250k</button>
      <button class="video-option" type="button" data-bitrate="500000" aria-pressed="true">500k</button>
      <button class="video-option" type="button" data-bitrate="1000000" aria-pressed="false">1m</button>
      <button class="video-option" type="button" data-bitrate="2000000" aria-pressed="false">2m</button>
    </div>
    <button class="virtual-key" type="button" data-key="BACK" data-label="返回" aria-label="返回">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"></path></svg>
    </button>
    <button class="virtual-key" type="button" data-key="HOME" data-label="主页" aria-label="主页">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5"></circle></svg>
    </button>
    <button class="virtual-key" type="button" data-key="APP_SWITCH" data-label="最近任务" aria-label="最近任务">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg>
    </button>
    <button id="fullscreen-toggle" class="virtual-key" type="button" aria-label="进入全屏" title="进入全屏" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"></path></svg>
    </button>
    <button id="video-bitrate" type="button" aria-label="视频码率：500k" aria-haspopup="true" aria-expanded="false" aria-controls="bitrate-options">500k</button>
    <button id="video-scale" type="button" aria-label="画面大小：1/2" aria-haspopup="true" aria-expanded="false" aria-controls="scale-options">1/2</button>
  </nav>
  <button id="keys-toggle" type="button" aria-expanded="false" aria-controls="virtual-keys" aria-label="显示控制按钮" title="显示控制按钮">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><rect x="14" y="14" width="6" height="6" rx="1"></rect></svg>
  </button>
  </main>
  <script src="/assets/settings.js"></script>
  <script>
    const TOUCH_MOVE_INTERVAL_MS = 1000 / 30;
    document.documentElement.classList.toggle("ios-standalone", navigator.standalone === true);
    const video = document.getElementById("screen-video");
    const screen = document.getElementById("screen");
    const screenViewport = document.getElementById("screen-viewport");
    const virtualKeys = document.getElementById("virtual-keys");
    const keysToggle = document.getElementById("keys-toggle");
    const fullscreenToggle = document.getElementById("fullscreen-toggle");
    const layer = document.getElementById("gesture-layer");
    const overlay = document.getElementById("gesture-overlay");
    const line = document.getElementById("gesture-line");
    const startMarker = document.getElementById("gesture-start");
    const endMarker = document.getElementById("gesture-end");
    const videoBitRateButton = document.getElementById("video-bitrate");
    const bitRateOptions = document.getElementById("bitrate-options");
    const videoScaleButton = document.getElementById("video-scale");
    const scaleOptions = document.getElementById("scale-options");
    const status = document.getElementById("status");
    let gesture = null;
    let busy = false;
    let videoEnabled = false;
    let videoConnecting = false;
    let videoGeneration = 0;
    let peerConnection = null;
    let videoSessionId = "";
    let controlSocket = null;
    let controlConnectPromise = null;
    let controlRequestID = 0;
    let controlReconnectTimer = 0;
    let pageIsClosing = false;
    const pendingControlRequests = new Map();
    let clearOverlayTimer = 0;
    let statusTimer = 0;
    let floatingDrag = null;
    let floatingTop = null;
    let suppressToggleClick = false;
    let suppressToggleTimer = 0;
    let screenshotWidth = 0;
    let screenshotHeight = 0;
    let screenshotScale = 1;
    function readVideoPreference(key, allowed, fallback) {
      try {
        const value = Number(localStorage.getItem(key));
        return allowed.includes(value) ? value : fallback;
      } catch (_) { return fallback; }
    }

    function saveVideoPreference(key, value) {
      try { localStorage.setItem(key, String(value)); } catch (_) {}
    }

    let selectedBitRate = readVideoPreference("screenbridge.bitrate", [250000, 500000, 1000000, 2000000], 500000);
    let selectedScale = readVideoPreference("screenbridge.scale", [2, 3, 4], 2);
    let videoRequestController = null;
    let pendingDisplayInfo = null;
    let displayWidth = 0;
    let displayHeight = 0;

    function fitScreen() {
      if (!screenshotWidth || !screenshotHeight) return;
      const bounds = screenViewport.getBoundingClientRect();
      if (!bounds.width || !bounds.height) return;
      const scale = Math.min(bounds.width / screenshotWidth, bounds.height / screenshotHeight);
      const fittedWidth = `${Math.floor(screenshotWidth * scale)}px`;
      screen.style.width = fittedWidth;
      screen.style.height = `${Math.floor(screenshotHeight * scale)}px`;
      scaleGestureOverlay();
      if (floatingTop !== null) setFloatingTop(floatingTop);
    }

    function setControlsExpanded(expanded) {
      if (!expanded) {
        bitRateChoice.setOpen(false);
        scaleChoice.setOpen(false);
      }
      virtualKeys.hidden = !expanded;
      if (expanded) setFloatingTop(keysToggle.offsetTop);
      keysToggle.setAttribute("aria-expanded", String(expanded));
      const label = expanded ? "隐藏控制按钮" : "显示控制按钮";
      keysToggle.setAttribute("aria-label", label);
      keysToggle.title = label;
    }

    function setFloatingTop(top) {
      const opensBelow = top + keysToggle.offsetHeight / 2 < screenViewport.clientHeight / 2;
      virtualKeys.classList.toggle("opens-below", opensBelow);
      const menuHeight = virtualKeys.hidden ? 0 : virtualKeys.offsetHeight + 8;
      const maxTop = Math.max(8, screenViewport.clientHeight - keysToggle.offsetHeight - 8 - (opensBelow ? menuHeight : 0));
      const minTop = Math.min(maxTop, Math.max(8, opensBelow ? 8 : menuHeight + 8));
      const clampedTop = Math.max(minTop, Math.min(maxTop, top));
      floatingTop = clampedTop;
      screenViewport.style.setProperty("--floating-controls-top", `${clampedTop}px`);
    }

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle("error", isError);
      status.classList.add("visible");
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => status.classList.remove("visible"), isError ? 3500 : 1800);
    }

    function drawGesture(start, end, visible = true) {
      const visibility = visible ? "visible" : "hidden";
      line.setAttribute("x1", start.x);
      line.setAttribute("y1", start.y);
      line.setAttribute("x2", end.x);
      line.setAttribute("y2", end.y);
      startMarker.setAttribute("cx", start.x);
      startMarker.setAttribute("cy", start.y);
      endMarker.setAttribute("cx", end.x);
      endMarker.setAttribute("cy", end.y);
      line.setAttribute("visibility", visibility);
      startMarker.setAttribute("visibility", visibility);
      endMarker.setAttribute("visibility", visibility);
    }

    function hideGesture() {
      drawGesture({ x: 0, y: 0 }, { x: 0, y: 0 }, false);
    }

    function imagePoint(event) {
      const rect = layer.getBoundingClientRect();
      if (!screenshotWidth || !screenshotHeight || !rect.width || !rect.height) return null;
      return {
        x: Math.max(0, Math.min(screenshotWidth - 1,
          Math.round((event.clientX - rect.left) * screenshotWidth / rect.width))),
        y: Math.max(0, Math.min(screenshotHeight - 1,
          Math.round((event.clientY - rect.top) * screenshotHeight / rect.height)))
      };
    }

    function devicePoint(point) {
      return mapVideoPoint(point, screenshotWidth, screenshotHeight, displayWidth, displayHeight);
    }

    function scaleGestureOverlay() {
      const rect = layer.getBoundingClientRect();
      if (!rect.width || !screenshotWidth) return;
      const scale = rect.width / screenshotWidth;
      const radius = 10 / scale;
      const strokeWidth = 2.5 / scale;
      for (const marker of [startMarker, endMarker]) {
        marker.setAttribute("r", radius);
        marker.style.strokeWidth = `${strokeWidth}px`;
      }
      line.style.strokeWidth = `${4 / scale}px`;
    }

    function waitForIceGathering(peer, timeoutMs = 12000) {
      if (peer.iceGatheringState === "complete") return Promise.resolve();
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          peer.removeEventListener("icegatheringstatechange", onStateChange);
          reject(new Error("ICE 候选收集超时"));
        }, timeoutMs);
        function onStateChange() {
          if (peer.iceGatheringState === "closed") {
            clearTimeout(timer);
            peer.removeEventListener("icegatheringstatechange", onStateChange);
            reject(new Error("WebRTC 连接已取消"));
            return;
          }
          if (peer.iceGatheringState !== "complete") return;
          clearTimeout(timer);
          peer.removeEventListener("icegatheringstatechange", onStateChange);
          resolve();
        }
        peer.addEventListener("icegatheringstatechange", onStateChange);
      });
    }

    async function closeVideoSession(sessionId) {
      if (!sessionId) return;
      try {
        await videoRequest("/webrtc/close", { sessionId }, { timeout: 6000, keepalive: true });
      } catch (_) {}
    }

    function applyVideoDisplayInfo(info) {
      if (gesture) releaseInterruptedGesture(gesture);
      screenshotWidth = info.width;
      screenshotHeight = info.height;
      screenshotScale = info.scale;
      displayWidth = info.displayWidth;
      displayHeight = info.displayHeight;
      overlay.setAttribute("viewBox", `0 0 ${screenshotWidth} ${screenshotHeight}`);
      fitScreen();
    }

    function applyPendingDisplayInfo() {
      const info = pendingDisplayInfo;
      if (!info || !videoEnabled || video.videoWidth !== info.width || video.videoHeight !== info.height) return;
      pendingDisplayInfo = null;
      applyVideoDisplayInfo(info);
    }
    video.addEventListener("resize", applyPendingDisplayInfo);

    function updateVideoSettings() {
      const disabled = videoConnecting || videoRestartPending;
      videoBitRateButton.disabled = disabled;
      videoScaleButton.disabled = disabled;
    }

    async function stopVideo() {
      videoRequestController?.abort();
      videoRequestController = null;
      pendingDisplayInfo = null;
      videoGeneration++;
      videoConnecting = false;
      videoEnabled = false;
      const peer = peerConnection;
      peerConnection = null;
      if (peer) {
        peer.onconnectionstatechange = null;
        peer.close();
      }
      video.srcObject = null;
      const sessionId = videoSessionId;
      videoSessionId = "";
      await closeVideoSession(sessionId);
      updateVideoSettings();
    }

    async function startVideo() {
      if (videoConnecting || videoEnabled) return;
      const generation = ++videoGeneration;
      const bitRate = selectedBitRate;
      const scale = selectedScale;
      const requestController = new AbortController();
      videoRequestController = requestController;
      videoConnecting = true;
      updateVideoSettings();
      setStatus("正在连接 H.264 视频流…");

      let peer = null;
      try {
        peer = new RTCPeerConnection({ iceServers: [] });
        peerConnection = peer;
        peer.addTransceiver("video", { direction: "recvonly" });
        const displayChannel = peer.createDataChannel("display");
        displayChannel.onmessage = event => {
          if (generation !== videoGeneration || peerConnection !== peer) return;
          try {
            pendingDisplayInfo = videoDisplayInfo(JSON.parse(event.data));
            applyPendingDisplayInfo();
          } catch (error) { setStatus(error.message || "画面尺寸更新失败", true); }
        };
        peer.ontrack = event => {
          if (generation !== videoGeneration || peerConnection !== peer) return;
          video.srcObject = event.streams[0] || new MediaStream([event.track]);
          video.play().catch(() => {});
        };
        peer.onconnectionstatechange = () => {
          if (generation !== videoGeneration || peerConnection !== peer) return;
          if (peer.connectionState === "failed") {
            setStatus("WebRTC 连接失败", true);
            void stopVideo();
          }
        };
        const offer = await peer.createOffer();
        await peer.setLocalDescription(offer);
        await waitForIceGathering(peer);
        const answer = await videoRequest("/webrtc/offer", {
          type: peer.localDescription.type, sdp: peer.localDescription.sdp, bitRate, scale
        }, { signal: requestController.signal });
        if (typeof answer.sessionId !== "string" || !answer.sessionId) throw new Error("视频会话信息无效");
        if (generation !== videoGeneration) {
          void closeVideoSession(answer.sessionId);
          return;
        }
        videoSessionId = answer.sessionId;
        applyVideoDisplayInfo(videoDisplayInfo(answer));
        await peer.setRemoteDescription({ type: answer.type, sdp: answer.sdp });
        if (generation !== videoGeneration) return;
        videoEnabled = true;
        applyPendingDisplayInfo();
        setStatus(`${screenshotWidth} × ${screenshotHeight} · H.264`);
      } catch (error) {
        if (generation !== videoGeneration) return;
        const sessionId = videoSessionId;
        videoSessionId = "";
        void closeVideoSession(sessionId);
        if (peer) {
          if (peerConnection === peer) peerConnection = null;
          peer.onconnectionstatechange = null;
          peer.close();
        }
        videoEnabled = false;
        setStatus(error.message || "视频流连接失败", true);
      } finally {
        if (videoRequestController === requestController) videoRequestController = null;
        if (generation === videoGeneration) {
          videoConnecting = false;
          updateVideoSettings();
        }
      }
    }

    function failPendingControlRequests(error, socket = null) {
      for (const [id, pending] of pendingControlRequests) {
        if (socket && pending.socket !== socket) continue;
        clearTimeout(pending.timer);
        pendingControlRequests.delete(id);
        pending.reject(error);
      }
    }

    function connectControlSocket() {
      if (pageIsClosing) return Promise.reject(new Error("控制连接已关闭"));
      if (controlSocket && controlSocket.readyState === WebSocket.OPEN) return Promise.resolve(controlSocket);
      if (controlConnectPromise) return controlConnectPromise;
      clearTimeout(controlReconnectTimer);

      const scheme = location.protocol === "https:" ? "wss:" : "ws:";
      let socket;
      let connectPromise;
      connectPromise = new Promise((resolve, reject) => {
        socket = new WebSocket(`${scheme}//${location.host}/ws/control`);
        controlSocket = socket;
        let opened = false;
        const timeout = setTimeout(() => {
          if (opened) return;
          reject(new Error("控制 WebSocket 连接超时"));
          socket.close();
        }, 5000);

        socket.addEventListener("open", () => {
          opened = true;
          clearTimeout(timeout);
          if (controlConnectPromise === connectPromise) controlConnectPromise = null;
          resolve(socket);
        });
        socket.addEventListener("message", event => {
          let message;
          try { message = JSON.parse(event.data); } catch (_) { return; }
          const pending = pendingControlRequests.get(String(message.id));
          if (!pending) {
            if (!message.ok && message.error) setStatus(message.error, true);
            return;
          }
          pendingControlRequests.delete(String(message.id));
          clearTimeout(pending.timer);
          if (message.ok) pending.resolve(message.result || {});
          else pending.reject(new Error(message.error || "控制操作失败"));
        });
        socket.addEventListener("error", () => {
          if (!opened) reject(new Error("控制 WebSocket 连接失败"));
        });
        socket.addEventListener("close", () => {
          clearTimeout(timeout);
          if (!opened) reject(new Error("控制 WebSocket 连接失败"));
          if (controlSocket === socket) controlSocket = null;
          if (controlConnectPromise === connectPromise) controlConnectPromise = null;
          failPendingControlRequests(new Error("控制连接中断，请重试"), socket);
          if (!pageIsClosing) {
            controlReconnectTimer = setTimeout(() => connectControlSocket().catch(() => {}), 1000);
          }
        });
      });
      controlConnectPromise = connectPromise;
      connectPromise.catch(() => {
        if (controlConnectPromise === connectPromise) controlConnectPromise = null;
      });
      return connectPromise;
    }

    async function sendAction(path, params) {
      const socket = await connectControlSocket();
      if (socket.readyState !== WebSocket.OPEN) throw new Error("控制连接中断，请重试");
      const id = String(++controlRequestID);
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          pendingControlRequests.delete(id);
          reject(new Error("控制操作等待超时"));
        }, 22000);
        pendingControlRequests.set(id, { socket, resolve, reject, timer });
        try {
          socket.send(JSON.stringify({ id, path, params }));
        } catch (error) {
          clearTimeout(timer);
          pendingControlRequests.delete(id);
          reject(error);
        }
      });
    }

    function sendTouchEvent(action, point) {
      const socket = controlSocket;
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        throw new Error("控制连接未就绪，请稍后重试");
      }
      const position = devicePoint(point);
      const params = { action, x: position.x, y: position.y };
      if (action === "down") {
        params.width = displayWidth;
        params.height = displayHeight;
      }

      const id = action === "move" ? "" : String(++controlRequestID);
      let rejectAck = null;
      if (id) {
        const acknowledgment = new Promise((resolve, reject) => {
          rejectAck = reject;
          const timer = setTimeout(() => {
            pendingControlRequests.delete(id);
            // Expire the acknowledgment silently; explicit failures still surface.
            resolve();
          }, 5000);
          pendingControlRequests.set(id, { socket, resolve, reject, timer });
        });
        acknowledgment.catch(error => setStatus(error.message || "触控操作失败", true));
      }
      try {
        socket.send(JSON.stringify({ id, path: "/touch", params }));
      } catch (error) {
        if (id) {
          const pending = pendingControlRequests.get(id);
          if (pending) {
            clearTimeout(pending.timer);
            pendingControlRequests.delete(id);
          }
          rejectAck?.(error);
        }
        throw error;
      }
    }

    function scheduleTouchMove(active, point) {
      active.pendingMove = point;
      if (active.moveTimer) return;
      const delay = Math.max(0, TOUCH_MOVE_INTERVAL_MS - (performance.now() - active.lastMoveAt));
      active.moveTimer = setTimeout(() => {
        active.moveTimer = 0;
        if (gesture !== active || !active.pendingMove) return;
        const next = active.pendingMove;
        active.pendingMove = null;
        active.lastMoveAt = performance.now();
        try {
          sendTouchEvent("move", next);
        } catch (error) {
          setStatus(error.message || "触控移动失败", true);
        }
      }, delay);
    }

    function releaseInterruptedGesture(active) {
      if (active.moveTimer) clearTimeout(active.moveTimer);
      active.moveTimer = 0;
      active.pendingMove = null;
      if (gesture === active) gesture = null;
      try {
        sendTouchEvent("cancel", active.end);
      } catch (error) {
        setStatus(error.message || "触控释放失败", true);
      }
      hideGesture();
    }

    async function executeAction(action) {
      if (busy) return;
      busy = true;
      layer.classList.add("busy");
      try {
        await sendAction(action.path, action.params);
      } catch (error) {
        setStatus(error.message || "操作失败", true);
      } finally {
        busy = false;
        layer.classList.remove("busy");
        clearOverlayTimer = setTimeout(hideGesture, 450);
      }
    }

    layer.addEventListener("pointerdown", event => {
      if (!virtualKeys.hidden) {
        setControlsExpanded(false);
        return;
      }
      if (busy || gesture || !screenshotWidth || (event.pointerType === "mouse" && event.button !== 0)) return;
      const point = imagePoint(event);
      if (!point) return;
      event.preventDefault();
      gesture = {
        pointerId: event.pointerId, start: point, end: point,
        lastMoveAt: performance.now(), pendingMove: null, moveTimer: 0
      };
      clearTimeout(clearOverlayTimer);
      drawGesture(point, point);
      try {
        sendTouchEvent("down", point);
      } catch (error) {
        gesture = null;
        hideGesture();
        setStatus(error.message || "触控开始失败", true);
        return;
      }
      try { layer.setPointerCapture(event.pointerId); } catch (_) {}
    });

    layer.addEventListener("pointermove", event => {
      if (!gesture || gesture.pointerId !== event.pointerId) return;
      const point = imagePoint(event);
      if (!point) return;
      gesture.end = point;
      drawGesture(gesture.start, point);
      scheduleTouchMove(gesture, point);
    });

    layer.addEventListener("pointerup", event => {
      if (!gesture || gesture.pointerId !== event.pointerId) return;
      event.preventDefault();
      const active = gesture;
      active.end = imagePoint(event) || active.end;
      gesture = null;

      if (active.moveTimer) clearTimeout(active.moveTimer);
      active.moveTimer = 0;
      active.pendingMove = null;
      try {
        sendTouchEvent("up", active.end);
      } catch (error) {
        setStatus(error.message || "触控结束失败", true);
      }
      clearOverlayTimer = setTimeout(hideGesture, 450);
    });

    layer.addEventListener("pointercancel", event => {
      if (!gesture || gesture.pointerId !== event.pointerId) return;
      releaseInterruptedGesture(gesture);
    });

    layer.addEventListener("contextmenu", event => event.preventDefault());

    let videoRestartPending = false;
    async function restartVideo() {
      if (videoRestartPending || !videoEnabled || pageIsClosing) return;
      videoRestartPending = true;
      if (gesture) releaseInterruptedGesture(gesture);
      updateVideoSettings();
      try {
        await stopVideo();
        if (!pageIsClosing) await startVideo();
      } finally {
        videoRestartPending = false;
        updateVideoSettings();
      }
    }
    const bitRateChoice = createVideoChoice({
      button: videoBitRateButton, menu: bitRateOptions, container: virtualKeys,
      viewport: screenViewport, attribute: "bitrate", label: "视频码率", initial: selectedBitRate,
      onOpen: () => scaleChoice.setOpen(false),
      onChange: value => { selectedBitRate = value; saveVideoPreference("screenbridge.bitrate", value); void restartVideo(); }
    });
    const scaleChoice = createVideoChoice({
      button: videoScaleButton, menu: scaleOptions, container: virtualKeys,
      viewport: screenViewport, attribute: "scale", label: "画面大小", initial: selectedScale,
      onOpen: () => bitRateChoice.setOpen(false),
      onChange: value => { selectedScale = value; saveVideoPreference("screenbridge.scale", value); void restartVideo(); }
    });
    document.addEventListener("pointerdown", event => {
      if (!virtualKeys.contains(event.target)) {
        bitRateChoice.setOpen(false);
        scaleChoice.setOpen(false);
      }
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !scaleOptions.hidden) {
        scaleChoice.setOpen(false);
        videoScaleButton.focus();
      }
      if (event.key === "Escape" && !bitRateOptions.hidden) {
        bitRateChoice.setOpen(false);
        videoBitRateButton.focus();
      }
    });
    document.querySelectorAll("[data-key]").forEach(button => {
      button.addEventListener("click", () => {
        setControlsExpanded(false);
        executeAction({
          path: "/key",
          params: { code: button.dataset.key }
        });
      });
    });
    keysToggle.addEventListener("pointerdown", event => {
      if (event.pointerType === "mouse" && event.button !== 0) return;
      const buttonBounds = keysToggle.getBoundingClientRect();
      const viewportBounds = screenViewport.getBoundingClientRect();
      floatingDrag = {
        pointerId: event.pointerId,
        startY: event.clientY,
        startTop: buttonBounds.top - viewportBounds.top,
        moved: false
      };
      try { keysToggle.setPointerCapture(event.pointerId); } catch (_) {}
    });
    keysToggle.addEventListener("pointermove", event => {
      if (!floatingDrag || floatingDrag.pointerId !== event.pointerId) return;
      const deltaY = event.clientY - floatingDrag.startY;
      if (!floatingDrag.moved && Math.abs(deltaY) < 5) return;
      floatingDrag.moved = true;
      setControlsExpanded(false);
      setFloatingTop(floatingDrag.startTop + deltaY);
    });
    function finishFloatingDrag(event) {
      if (!floatingDrag || floatingDrag.pointerId !== event.pointerId) return;
      if (floatingDrag.moved) {
        suppressToggleClick = true;
        clearTimeout(suppressToggleTimer);
        suppressToggleTimer = setTimeout(() => { suppressToggleClick = false; }, 400);
      }
      floatingDrag = null;
    }
    keysToggle.addEventListener("pointerup", finishFloatingDrag);
    keysToggle.addEventListener("pointercancel", finishFloatingDrag);
    keysToggle.addEventListener("click", () => {
      if (suppressToggleClick) {
        suppressToggleClick = false;
        clearTimeout(suppressToggleTimer);
        return;
      }
      setControlsExpanded(virtualKeys.hidden);
    });
    function updateFullscreenButton() {
      const active = document.fullscreenElement === document.documentElement;
      const label = active ? "退出全屏" : "进入全屏";
      fullscreenToggle.setAttribute("aria-pressed", String(active));
      fullscreenToggle.setAttribute("aria-label", label);
      fullscreenToggle.title = label;
    }

    async function toggleFullscreen() {
      setControlsExpanded(false);
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch (error) {
        setStatus(error.message || "无法切换全屏", true);
      }
    }

    fullscreenToggle.disabled = !document.fullscreenEnabled || !document.documentElement.requestFullscreen;
    fullscreenToggle.hidden = /Safari/.test(navigator.userAgent) && !/Chrome|Chromium|CriOS|Edg|OPR|FxiOS/.test(navigator.userAgent);
    if (fullscreenToggle.disabled) fullscreenToggle.title = "当前浏览器不支持网页全屏";
    fullscreenToggle.addEventListener("click", toggleFullscreen);
    document.addEventListener("fullscreenchange", () => {
      if (gesture) releaseInterruptedGesture(gesture);
      updateFullscreenButton();
      fitScreen();
    });
    window.addEventListener("resize", fitScreen);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", fitScreen);
    window.addEventListener("pagehide", () => {
      pageIsClosing = true;
      videoRequestController?.abort();
      clearTimeout(controlReconnectTimer);
      if (controlSocket) controlSocket.close(1000, "page closing");
      const sessionId = videoSessionId;
      if (sessionId) {
        navigator.sendBeacon("/webrtc/close", new Blob([JSON.stringify({ sessionId })], { type: "application/json" }));
      }
      if (peerConnection) peerConnection.close();
    });
    void connectControlSocket().catch(() => {});
    void startVideo();
  </script>
</body>
</html>
